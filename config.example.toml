[app]
timezone = "Asia/Shanghai"
state_dir = "var"
secrets_file = ".env"

[poll]
# launchd 负责整点日历调度；0 表示不再叠加应用层冷却。
interval_seconds = 0
page_size = 30
# 0 表示不设置页数上限；分页异常由 token/重复页检测终止。
max_pages = 0
max_posts = 0
# 0 表示不设置本轮 HTTP 请求次数上限。
max_requests = 0
request_spacing_seconds = 2
retry_wait_seconds = 5
run_timeout_seconds = 180
connect_timeout_seconds = 5
read_timeout_seconds = 15

[source]
# T0 尚未完成账号实测，以下值必须由本地验证后填写；示例不预填猜测地址。
endpoint = ""
post_url_template = ""
contract_confirmed = false
timestamp_unit = "seconds"

[filters]
include_any = []
exclude_any = []

# 关注摘要默认关闭；命中后触发推送并优先展示完整详情，不改变采集范围。
[attention]
enabled = false
# 独立职业规则：行业/岗位（含央国企、公务员、事业单位）+ 职业议题，或明确求职择业表达。
career_enabled = false
title_max_chars = 40
max_title_categories = 2
# 公开示例不预设个人地点偏好；可填 "深圳"、"远程"，顺序即优先级。
preferred_locations = []

[attention.keywords]
# 未列出的分组沿用代码内的通用预设；显式 [] 表示关闭该分组。
llm4se = ["LLM4SE", "AI4SE", "代码智能", "coding agent", "SWE-bench"]
llm = ["大模型", "大语言模型", "大型语言模型", "LLM", "LLMs"]
agent = ["智能体", "AI Agent", "多智能体", "coding agent", "Agent"]

[notify]
provider = "stdout"
# 可选 wechat 或 app；stdout 时仅用于离线预览。
channel = "wechat"
content_mode = "snippet"
max_items = 20
snippet_chars = 120
max_message_chars = 6000
# 0 保持“有新帖即推送”；设为 100 则累计到 101 条，或命中关注主题时推送。
push_when_post_count_exceeds = 0
max_send_attempts_per_day = 200
pending_ttl_hours = 24
# 同一轮清理积压时，两次 PushPlus 请求至少间隔 13 秒，低于每分钟 5 次的限制。
send_spacing_seconds = 13
send_retry_spacing_seconds = 1800
